name: ci

# GitHub is a mirror of Forgejo, so this gates nothing (real PRs live on
# Forgejo/Woodpecker). It runs mainly on the mirrored main + tags and is
# kept truthful — a mirror sync carrying a broken tree shows red.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags integration ./... -run '^$'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run yamllint .

  # Build (don't push) the image so a broken Dockerfile is caught here rather
  # than only when a release tag first builds it. Single-arch is enough to
  # exercise the Dockerfile; the multi-arch push lives in release.yaml.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false

  # Docker acceptance for unifi-emu-herder on the target Linux amd64 shape.
  # Both images are built locally from this checkout and the herder is pointed
  # at them, so the job proves the real container contract without depending on
  # a published tag. No runtime mapping is installed: the fixture image stands
  # in for an opaque runtime, and the mapping file is written per test.
  herder-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Report the Docker engine and API versions
        run: docker version --format 'engine={{.Server.Version}} api={{.Server.APIVersion}}'
      - name: Build the public synthetic image
        run: |
          docker build --build-arg BUILDPLATFORM=linux/amd64 \
            -t unifi-emu-herder-itest/synthetic:ci .
      - name: Build the public fixture runtime image
        run: |
          docker build -f internal/herder/testdata/runtime-fixture/Dockerfile \
            -t unifi-emu-herder-itest/fixture:ci .
      - name: Run the herder Docker acceptance suite
        env:
          UNIFI_EMU_HERDER_ITEST_SYNTHETIC_IMAGE: unifi-emu-herder-itest/synthetic:ci
          UNIFI_EMU_HERDER_ITEST_FIXTURE_IMAGE: unifi-emu-herder-itest/fixture:ci
        run: go test -tags integration -count=1 -timeout 25m -v ./internal/herder/
      - name: Confirm no herder container survived
        if: always()
        run: |
          left=$(docker ps -aq --filter label=io.unifi-emu.herder=true | wc -l)
          docker ps -a --filter label=io.unifi-emu.herder=true
          test "$left" -eq 0

  # Live classic-controller integration tests via Testcontainers. GitHub
  # runners have native Docker, so no runtime plumbing is needed. This boots
  # real controllers, so it runs in minutes, not seconds. UOS is excluded: it
  # needs host cgroup ns and an unpublished seeded image, so it stays a manual
  # gate (the Woodpecker gate only compiles the integration tests).
  itest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -run TestClassic -count=1 -timeout 35m -v .
      # The harness captures controller.log, server.log, emulator.log and the
      # device listings into tmp/itest, and those are the only record of why a
      # live adoption failed -- the containers are gone once the job ends.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: itest-evidence
          path: tmp/itest/
          if-no-files-found: warn
