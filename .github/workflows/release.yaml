name: release

# Cut a release by pushing a v* tag to Forgejo; the push-mirror replicates
# the tag to GitHub, which fires this workflow. GoReleaser publishes the
# GitHub Release + CLI archives; the image job pushes the multi-arch
# container to GHCR. Auth is the built-in GITHUB_TOKEN (repo and image
# share the jamesbraid owner).
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  # The install-herder action resolves `uses: ...@vX.Y.Z` through its own
  # VERSION file, so a tag that forgot to bump it would quietly hand callers the
  # previous release's binary under the new tag's name. Both publishing jobs
  # wait on this, because that is a wrong answer rather than a missing one.
  pinned-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(cat .github/actions/install-herder/VERSION)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::install-herder VERSION says ${got}, but this tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

  goreleaser:
    needs: pinned-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: pinned-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jamesbraid/unifi-emu
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Publish in Docker manifest format, not OCI. HEALTHCHECK is a Docker
          # config-schema field with no OCI equivalent, so an OCI config carries
          # it only as a non-standard extension that OCI-strict runtimes drop on
          # a registry round-trip -- the image then reads as declaring no
          # healthcheck. oci-mediatypes=false makes the config Docker-typed and
          # the healthcheck first-class; provenance=false stops buildx wrapping
          # the push in an OCI attestation index.
          provenance: false
          outputs: type=registry,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
